AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Confiança entre o GitHub Actions e a conta AWS via OIDC.
  Cria o provedor OIDC (opcional) e a role que o workflow de deploy assume.
  Rode UMA vez, com credenciais de administrador. Depois disso o repositório não guarda access key nenhuma.

Parameters:
  AllowedSub:
    Type: String
    Default: "repo:diegobroetto@23634224/observability-demo@1303092806:ref:refs/heads/main"
    Description: >
      Valor exato do claim sub que pode assumir a role. O default usa o formato imutável
      (owner@id/repo@id) de repositórios criados depois de 15/07/2026. Em repositórios antigos
      o formato é repo:OWNER/REPO:ref:refs/heads/main.
  CreateOidcProvider:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "true"
    Description: Use false se a conta já tem o provedor token.actions.githubusercontent.com (só pode existir um por conta)
  StackNamePrefix:
    Type: String
    Default: observability-demo
    Description: Prefixo dos stacks que a role pode criar e atualizar

Conditions:
  CreateProvider: !Equals [!Ref CreateOidcProvider, "true"]

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "github-actions-${StackNamePrefix}-deploy"
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateProvider
                - !Ref GitHubOidcProvider
                - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                "token.actions.githubusercontent.com:aud": sts.amazonaws.com
                "token.actions.githubusercontent.com:sub": !Ref AllowedSub
      Policies:
        - PolicyName: sam-deploy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: CloudFormationNosStacksDoProjeto
                Effect: Allow
                Action:
                  - cloudformation:CreateStack
                  - cloudformation:UpdateStack
                  - cloudformation:DeleteStack
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResource
                  - cloudformation:DescribeStackResources
                  - cloudformation:GetTemplate
                  - cloudformation:GetTemplateSummary
                  - cloudformation:CreateChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:ListStackResources
                Resource:
                  - !Sub "arn:${AWS::Partition}:cloudformation:*:${AWS::AccountId}:stack/${StackNamePrefix}-*/*"
                  - !Sub "arn:${AWS::Partition}:cloudformation:*:${AWS::AccountId}:stack/aws-sam-cli-managed-default/*"
              - Sid: TransformDoSam
                Effect: Allow
                Action: cloudformation:CreateChangeSet
                Resource: !Sub "arn:${AWS::Partition}:cloudformation:*:aws:transform/Serverless-2016-10-31"
              - Sid: BucketGerenciadoPeloSam
                Effect: Allow
                Action:
                  - s3:CreateBucket
                  - s3:GetBucketLocation
                  - s3:ListBucket
                  - s3:GetObject
                  - s3:PutObject
                  - s3:PutBucketPolicy
                  - s3:PutBucketVersioning
                  - s3:PutEncryptionConfiguration
                  - s3:PutBucketPublicAccessBlock
                  - s3:PutLifecycleConfiguration
                  - s3:GetBucketPolicy
                  - s3:GetBucketVersioning
                Resource:
                  - !Sub "arn:${AWS::Partition}:s3:::aws-sam-cli-managed-default-*"
                  - !Sub "arn:${AWS::Partition}:s3:::aws-sam-cli-managed-default-*/*"
              - Sid: RolesDasFuncoes
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:PassRole
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:GetRolePolicy
                Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${StackNamePrefix}-*"
              - Sid: RecursosDoProjeto
                Effect: Allow
                Action:
                  - lambda:*
                  - dynamodb:*
                  - events:*
                  - logs:*
                  - cloudwatch:PutMetricAlarm
                  - cloudwatch:DeleteAlarms
                  - cloudwatch:DescribeAlarms
                  - cloudwatch:PutDashboard
                  - cloudwatch:DeleteDashboards
                  - cloudwatch:GetDashboard
                  - cloudwatch:TagResource
                Resource: "*"
              - Sid: ApiGateway
                Effect: Allow
                Action:
                  - apigateway:GET
                  - apigateway:POST
                  - apigateway:PUT
                  - apigateway:PATCH
                  - apigateway:DELETE
                Resource: !Sub "arn:${AWS::Partition}:apigateway:*::/*"

Outputs:
  DeployRoleArn:
    Description: Cole este ARN na variável AWS_DEPLOY_ROLE_ARN do repositório (Settings > Secrets and variables > Actions > Variables)
    Value: !GetAtt DeployRole.Arn
